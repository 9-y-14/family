# Cloudflare Pages + D1 配置
# 1. 创建数据库: wrangler d1 create family-db
# 2. 将下方 database_id 替换为创建时返回的 ID
# 3. 初始化表: wrangler d1 execute family-db --remote --file=./schema.sql
# 4. Pages 部署时绑定 D1，并设置环境变量 JWT_SECRET

name = "family-manager"
compatibility_date = "2024-08-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "family-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
